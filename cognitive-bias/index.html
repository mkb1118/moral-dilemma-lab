<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="认知偏差检测：36 个情境题，检测确认偏误、锚定效应、损失厌恶等 12 类常见思维陷阱。">
<meta property="og:title" content="认知偏差检测">
<meta property="og:description" content="看见那些悄悄影响你判断的大脑捷径，生成认知偏差抵抗力报告。">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary">
<title>认知偏差检测</title>
<link rel="stylesheet" href="../assets/psych-lab.css">
<script src="../assets/psych-lab.js"></script>
<script src="../assets/api-client.js"></script>
<script src="../assets/psych-lab-sync.js"></script>
<style>
  .choices { display: flex; flex-direction: column; gap: 10px; }
  .choice-btn { width: 100%; padding: 16px 20px; background: var(--card); border: 1px solid var(--border); border-radius: 8px; color: var(--white); text-align: left; font-size: 15px; font-weight: 300; cursor: pointer; transition: all 0.25s; display: flex; align-items: center; gap: 12px; }
  .choice-btn:hover { border-color: var(--cyan); background: var(--card-hover); transform: translateX(4px); }
.choice-btn:hover .choice-marker { border-color: var(--cyan); background: rgba(0,229,255,0.15); }
  .q-nav { display: flex; align-items: center; margin-bottom: 10px; width: 100%; }

  .score-card { width: 100%; background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 24px; margin-bottom: 16px; text-align: center; border-left: 2px solid var(--cyan); }
.score-label { font-size: 14px; color: var(--dim); margin-top: 4px; }

  .bias-card { width: 100%; background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 20px 24px; margin-bottom: 12px; }
  .bias-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
  .bias-name { font-size: 15px; font-weight: 400; display: flex; align-items: center; gap: 8px; }
  .bias-score-tag { font-family: var(--mono); font-size: 11px; padding: 3px 10px; border-radius: 12px; }
  .bias-score-tag.high { background: rgba(0,229,255,0.1); color: var(--cyan); border: 1px solid rgba(0,229,255,0.2); }
  .bias-score-tag.mid { background: rgba(245,166,35,0.1); color: var(--amber); border: 1px solid rgba(245,166,35,0.2); }
  .bias-score-tag.low { background: rgba(240,244,248,0.05); color: var(--dim); border: 1px solid rgba(240,244,248,0.1); }
  .bias-dots { display: flex; gap: 4px; margin: 8px 0; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--border); }
  .dot.filled { background: var(--cyan); }
  .bias-desc { font-size: 13px; color: var(--dim); line-height: 1.6; font-weight: 300; margin-top: 8px; }

  .awareness-meter { display: flex; align-items: center; gap: 10px; margin: 10px 0; }
  .awareness-label { font-family: var(--mono); font-size: 10px; color: var(--dim); opacity: 0.6; min-width: 36px; }
  .awareness-label.right { min-width: auto; text-align: right; font-size: 11px; opacity: 1; }
  .awareness-bar-wrap { flex: 1; height: 6px; background: var(--border); border-radius: 3px; overflow: hidden; }
  .awareness-bar-fill { height: 100%; border-radius: 3px; transition: width 1s ease; }
  .awareness-bar-fill.high { background: var(--cyan); }
  .awareness-bar-fill.mid { background: rgba(0,229,255,0.4); }
  .awareness-bar-fill.low { background: rgba(245,166,35,0.5); }
</style>
</head>
<body>
<div class="app">
  <!-- WELCOME -->
  <div class="screen active" id="welcome">
    <div class="welcome-icon">🔍</div>
    <div class="title-block">
      <div class="label">Cognitive Biases</div>
      <h1>认知偏差<br><span>检测</span></h1>
    </div>
    <p class="subtitle">你的大脑有看不见的"思维捷径"——它们帮你快速决策，也让你系统性地犯错。24个情境题，看看哪些认知偏差在悄悄影响你。</p>
    <div class="info-badge"><span></span> 36 题 · 约 7 分钟 · 基于心理学经典研究</div>
    <div class="action-row"><button class="btn primary" id="startBtn">开始</button><a class="btn secondary" href="../index.html">返回</a></div>
  </div>

  <!-- QUIZ -->
  <div class="screen" id="quiz">
    <div class="progress-wrap">
      <div class="progress-info"><span id="progLabel">1 / 36</span><span id="progPct">0%</span></div>
      <div class="progress-track"><div class="progress-fill" id="progFill" style="width:0%"></div></div>
    </div>
    <div class="q-nav"><button class="btn-back" id="btnBack" id="backBtn" style="visibility:hidden;">← 上一题</button></div>
    <div class="q-card"><div class="q-num" id="qNum"></div><p class="q-scene" id="qScene"></p></div>
    <div class="choices" id="choices"></div>
  </div>

  <!-- RESULTS -->
  <div class="screen" id="results">
    <div class="results-header">
      <div class="label">Bias Detection Complete</div>
      <h2>你的认知偏差检测报告</h2>
    </div>
    <div class="score-card">
      <div class="score-number" id="totalScore"></div>
      <div class="score-label">认知偏差抵抗力</div>
      <div style="font-size:13px;color:var(--dim);margin-top:6px;line-height:1.6;font-weight:300;" id="totalLabel"></div>
    </div>
    <div id="biasList"></div>
    <div class="lab-next-card">
      <div><strong>推荐下一项实验：决策风格分析</strong>看见思维偏差之后，继续了解你习惯用哪种方式做决定。</div>
      <a class="lab-home-link" href="../decision-style/index.html">继续实验 →</a>
    </div>
    <div class="action-row">
      <button class="btn primary" id="restartBtn">重新检测</button>
      <button class="btn" id="shareBtn">📤 分享结果</button>
    </div>
    <div style="text-align:center;margin-bottom:16px;"><a href="../index.html" style="color:var(--dim);font-family:var(--mono);font-size:11px;text-decoration:none;border:1px solid rgba(240,244,248,0.1);padding:6px 16px;border-radius:4px;transition:all 0.2s;">🏠 返回测试广场</a></div>
    <p class="footer-note">基于心理学经典研究改编 · 仅供自我觉察，非临床诊断</p>
  </div>
</div>

<script>
// ============================================
// 36 SCENARIOS: 12 biases × 3 scenarios each
// 基于 Tversky & Kahneman (1974), Arkes & Blumer (1985),
// Ross (1977), Kruger & Dunning (1999), etc.
// ============================================
let SCENARIOS = null;

let BIAS_INFO = null;

// ============================================
// STATE
// ============================================
let currentQ = 0;
let answers = []; // {questionId, score (0 or 1)}
let isAdvancing = false;
let resultsShown = false;
const PROGRESS_KEY = 'psych-lab-cognitive-bias';
  PsychLabSync.init('cognitive-bias');

  function initEvents() {
    document.getElementById('startBtn')?.addEventListener('click', startTest);
    document.getElementById('backBtn')?.addEventListener('click', goBack);
    document.getElementById('restartBtn')?.addEventListener('click', restartTest);
    document.getElementById('shareBtn')?.addEventListener('click', shareResults);
    document.querySelector('#quiz .choices')?.addEventListener('click', function(e) {
      var btn = e.target.closest('[data-cb="answer"]');
      if (btn) {
        var score = parseInt(btn.dataset.score || btn.getAttribute('data-score'), 10);
        answer(score, btn);
      }
    });
  }

function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

function startTest() {
  currentQ = 0; answers = [];
  isAdvancing = false;
  resultsShown = false;
  PsychLabSync.reset(); PsychLabSync.start("standard");
  showScreen('quiz');
  renderQuestion();
}

function renderQuestion() {
  const q = SCENARIOS[currentQ];
  const pct = Math.round((currentQ / SCENARIOS.length) * 100);
  document.getElementById('progLabel').textContent = `${currentQ + 1} / ${SCENARIOS.length}`;
  document.getElementById('progPct').textContent = `${pct}%`;
  document.getElementById('progFill').style.width = `${pct}%`;
  if (window.PsychLab) PsychLab.syncProgressBar(document.getElementById('progFill'));
  document.getElementById('qNum').textContent = `SCENARIO ${q.id}`;
  document.getElementById('qScene').textContent = q.text;
  document.getElementById('btnBack').style.visibility = currentQ > 0 ? 'visible' : 'hidden';

  document.getElementById('choices').innerHTML = q.opts.map((o, i) => `
    <button class="choice-btn" data-cb="answer" aria-label="选项：${o.text.replace(/"/g, '&quot;').substring(0, 60)}">
      <span class="choice-marker"></span>
      <span>${o.text}</span>
    </button>
  `).join('');

  const card = document.querySelector('.q-card');
  card.style.opacity = '0'; card.style.transform = 'translateY(8px)';
  requestAnimationFrame(() => { card.style.transition = 'all 0.3s'; card.style.opacity = '1'; card.style.transform = 'translateY(0)'; });
}

function answer(score, btn) {
  if (isAdvancing || resultsShown) return;
  if (currentQ < 0 || currentQ >= SCENARIOS.length) return;
  const q = SCENARIOS[currentQ];
  if (!q) return;

  isAdvancing = true;
  document.querySelectorAll('.choice-btn').forEach(b => {
    b.style.opacity = '0.4';
    b.disabled = true;
  });
  btn.style.opacity = '1'; btn.style.borderColor = 'var(--cyan)';
  answers[currentQ] = { questionId: q.id, score: score };
  setTimeout(() => {
    if (resultsShown) return;
    currentQ++;
    if (currentQ >= SCENARIOS.length) {
      document.getElementById('progPct').textContent = '100%';
      document.getElementById('progFill').style.width = '100%';
      if (window.PsychLab) PsychLab.syncProgressBar(document.getElementById('progFill'));
      resultsShown = true;
      isAdvancing = false;
      setTimeout(showResults, 300);
    }
    else {
      isAdvancing = false;
      renderQuestion();
      if (window.PsychLab) PsychLab.saveProgress(PROGRESS_KEY, { currentQ: currentQ, answers: answers, total: SCENARIOS.length });
    }
  }, 250);
}

function goBack() {
  if (isAdvancing || resultsShown || currentQ <= 0) return;
  currentQ--;
  renderQuestion();
}

// ============================================
// RESULTS
// ============================================
function showResults() {
  PsychLabSync.complete(biasScores, "认知偏差检测完成").catch(function(){});
  PsychLab.clearProgress(PROGRESS_KEY);
  const biasScores = {};
  SCENARIOS.forEach((q, idx) => {
    if (!biasScores[q.biasKey]) biasScores[q.biasKey] = { total: 0, hits: 0 };
    biasScores[q.biasKey].total++;
    if (answers[idx] && answers[idx].score === 1) biasScores[q.biasKey].hits++;
  });

  // Overall: lower = less biased. 0 hits = great, 24 hits = every bias triggered.
  const totalAvoided = Object.values(biasScores).reduce((s, b) => s + (b.total - b.hits), 0);
  const maxHits = 36;
  const awarenessScore = Math.round((totalAvoided / maxHits) * 100);

  let totalLabel;
  if (awarenessScore >= 85) totalLabel = '你在大多数情境中成功识别并绕开了思维陷阱。你的认知习惯非常健康——不仅能保护自己，也能在团队中成为那个"等一下，我们是不是在犯XX偏差"的提醒者。';
  else if (awarenessScore >= 65) totalLabel = '整体来看，你对大部分认知偏差有相当的抵抗力，但在某些特定类型的思维陷阱面前，你的防御偶尔会失效。下面的报告会告诉你哪些偏差最需要安装"认知刹车"。';
  else if (awarenessScore >= 45) totalLabel = '你的思维有大约一半的时候能避开这些经典陷阱，另一半时候会被它们悄悄影响。这不代表你"不理性"——Kahneman的研究表明，偏差是大脑的出厂设置，连专家都需要刻意训练才能减少。好消息是：你能做这个测试，说明你已经在路上了。';
  else totalLabel = '你在这项测试中比较容易被各种认知偏差影响。但这恰恰说明你的自我觉察很诚实——达克效应告诉我们，最需要警惕的人恰恰是那些觉得"我完全没问题"的人。下面的具体训练方法会帮你从今天开始武装自己的思维。';

  document.getElementById('totalScore').textContent = awarenessScore + '%';
  document.getElementById('totalLabel').textContent = totalLabel;

  // Show strong areas (biases they resisted) in a summary
  const strongAreas = Object.keys(BIAS_INFO).filter(k => {
    const s = biasScores[k];
    return s && s.hits === 0;
  }).map(k => BIAS_INFO[k].icon + BIAS_INFO[k].name);
  const weakAreas = Object.keys(BIAS_INFO).filter(k => {
    const s = biasScores[k];
    return s && s.hits >= 2;
  }).map(k => BIAS_INFO[k].icon + BIAS_INFO[k].name);

  // Bias cards with intuitive labels
  const orderedKeys = Object.keys(BIAS_INFO);
  document.getElementById('biasList').innerHTML = orderedKeys.map(key => {
    const info = BIAS_INFO[key];
    const score = biasScores[key] || { hits: 0, total: 3 };
    const hits = score.hits, total = score.total;
    const avoided = total - hits;

    // Intuitive labels + dynamic feedback
    let level, cls, fillPct, feedbackLabel, feedbackText, feedbackColor;
    if (hits === 0) {
      level = '完全避开了';
      cls = 'low';
      fillPct = 100;
      feedbackLabel = '👏 做得很好';
      feedbackColor = 'rgba(0,229,255,0.7)';
      feedbackText = '在这类思维陷阱面前，你展现出了出色的觉察力。你没有被它牵着走——这说明你在做判断时习惯性地在"检查自己的思考"。保持这个习惯，也可以在关键时刻提醒身边的人："我们会不会在犯XX偏差？"';
    } else if (hits === 1) {
      level = '基本能避开';
      cls = 'mid';
      fillPct = 66;
      feedbackLabel = '👍 还不错';
      feedbackColor = 'rgba(0,229,255,0.5)';
      feedbackText = '你在大多数情况下能抵抗这个偏差，但偶尔还是会被它悄悄影响。下面这条策略不是为了"改正错误"——而是帮你把那"偶尔"变得更少。';
    } else if (hits === 2) {
      level = '容易被影响';
      cls = 'mid';
      fillPct = 33;
      feedbackLabel = '💡 值得留意';
      feedbackColor = 'rgba(245,166,35,0.7)';
      feedbackText = '这个偏差对你来说是一个真实的挑战——它确实在影响你的判断。不过这完全正常：这些偏差本来就是大脑的出厂设置。下面的策略不是批评，而是一套经过研究验证的训练方法，帮你建立更强的"认知刹车"。';
    } else {
      level = '影响很明显';
      cls = 'high';
      fillPct = 0;
      feedbackLabel = '🌟 成长空间';
      feedbackColor = 'rgba(245,166,35,0.5)';
      feedbackText = '这个偏差在目前阶段对你影响较大。但请记得——承认自己被偏差影响，本身就是一种高级的自我觉察。大多数人甚至不会意识到自己在犯这些错误。你现在看到了它，就已经迈出了最重要的一步。下面这套方法，可以从今天开始改变。';
    }

    const barHtml = `
      <div class="awareness-meter">
        <div class="awareness-label">抵抗力</div>
        <div class="awareness-bar-wrap">
          <div class="awareness-bar-fill ${cls}" style="width:${fillPct}%;"></div>
        </div>
        <div class="awareness-label right">${level}</div>
      </div>
    `;

    return `
      <div class="bias-card">
        <div class="bias-header">
          <span class="bias-name">${info.icon} ${info.name}</span>
        </div>
        ${barHtml}
        <div class="bias-desc">${info.desc}</div>
        <div class="bias-desc" style="margin-top:8px; color:${feedbackColor};"><b>${feedbackLabel}：</b>${feedbackText}</div>
        <div class="bias-desc" style="margin-top:8px; color:${feedbackColor}; opacity:0.8;">${hits === 0 ? '<b>🔬 背后的研究：</b>' + info.ref.split('.')[0] + '。继续保持你的认知习惯。' : '<b>🔧 研究验证的改善方法：</b>' + info.fix}</div>
      </div>
    `;
  }).join('');

  // Add strength/weakness summary at top of bias list
  const summaryHtml = [];
  if (strongAreas.length > 0) summaryHtml.push('<div style="font-size:13px;color:var(--dim);margin-bottom:12px;line-height:1.6;">✅ <b>你抵抗力最强的领域：</b>' + strongAreas.join('、') + ' —— 在这些思维陷阱面前你有很好的觉察力。</div>');
  if (weakAreas.length > 0) summaryHtml.push('<div style="font-size:13px;color:var(--dim);margin-bottom:16px;line-height:1.6;">⚠️ <b>你最需要关注的领域：</b>' + weakAreas.join('、') + ' —— 建议重点阅读下面的矫正策略。</div>');
  document.getElementById('biasList').innerHTML = summaryHtml.join('') + document.getElementById('biasList').innerHTML;

  showScreen('results');

  // Animate awareness bars
  requestAnimationFrame(() => {
    document.querySelectorAll('.awareness-bar-fill').forEach(bar => {
      const w = bar.style.width;
      bar.style.width = '0%';
      requestAnimationFrame(() => { bar.style.width = w; });
    });
  });
}

// ============================================
// SHARE
// ============================================
function shareResults() {
  const score = document.getElementById('totalScore').textContent;
  const text = `🔍 认知偏差检测——我对12种经典思维陷阱的抵抗力：${score}\n\n36个情境题，测了确认偏误、锚定效应、损失厌恶、达克效应、基本归因错误等12种认知偏差。\n\n你的大脑也有这些"思维捷径"吗？3分钟，看见自己的认知模式。\n👉 ${window.PsychLab ? PsychLab.currentUrl() : location.href}`;

  if (window.PsychLab) PsychLab.copyText(text, '已复制！');
  else if (navigator.clipboard) navigator.clipboard.writeText(text).then(() => showToast('已复制！'));
}

function showToast(msg) {
  const old = document.querySelector('.toast'); if (old) old.remove();
  const t = document.createElement('div'); t.className = 'toast'; t.textContent = msg;
  document.body.appendChild(t); setTimeout(() => t.remove(), 2500);
}

function restartTest() { PsychLab.clearProgress(PROGRESS_KEY); currentQ = 0; answers = []; isAdvancing = false; resultsShown = false;
  showScreen('welcome'); }
</script>
<script>
(function () {
  var saved = PsychLab.loadProgress(PROGRESS_KEY);
  if (!saved || saved.resultsShown) return;
  var welcomeEl = document.getElementById('welcome');
  PsychLab.injectResumePrompt(welcomeEl, PROGRESS_KEY, saved,
    function onContinue(s) { currentQ = s.currentQ; answers = s.answers; isAdvancing = false; resultsShown = false;
  PsychLabSync.reset(); PsychLabSync.start("standard");
  showScreen('quiz'); renderQuestion(); },
    function onRestart() { restartTest(); }
  );
})();

(async function () {
  try {
    var __d = await Promise.all([
      PsychLab.loadData('data/scenarios.json'),
      PsychLab.loadData('data/bias-info.json')
    ]);
    SCENARIOS = __d[0];
    BIAS_INFO = __d[1];
  } catch (err) {
    console.error('加载题目数据失败：', err);
    if (window.PsychLab) PsychLab.showToast('题目数据加载失败，请通过 http://127.0.0.1:3000 访问');
  }
  initEvents();
})();</script>
</body>
</html>
