# ============================================================
# Render 一键部署蓝图（副本）
#
# 真正的 Blueprint 在【仓库根目录】的 render.yaml —— Render 默认只从
# 仓库根目录读取它。这份副本保留在这里只是为了「部署配置跟项目放在一起」
# 好找，内容与根目录那份完全一致。
#
# ⚠️ 两份必须保持同步，否则会互相矛盾。
#
# ⚠️ 关键：dockerContext / dockerfilePath 一律相对【仓库根目录】解析，
#    不是相对本文件所在位置。所以路径要写 ./psychlab/... 而不是 ./...
#    写错的话 Render 找不到 Dockerfile，部署直接失败。
#
# 用法：仓库推到 GitHub → render.com → New → Blueprint → 选仓库
# ============================================================

databases:
  - name: psychlab-db
    databaseName: psychlab
    user: psychlab

services:
  - type: web
    name: psychlab
    runtime: docker
    dockerContext: ./psychlab              # 构建上下文 = psychlab/
    dockerfilePath: ./psychlab/Dockerfile  # 相对仓库根目录，不是相对本文件
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: psychlab-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      # 同源部署时一般无需配置（后端已自动放行同源）；跨域部署才需要填写
      - key: CORS_ORIGIN
        value: ""
