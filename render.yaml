# ============================================================
# Render 一键部署蓝图
# 用法：把本项目推到 GitHub → render.com → New → Blueprint → 选仓库
# Render 会自动创建下面的 PostgreSQL 数据库 + Web 服务
# ============================================================

databases:
  - name: psychlab-db
    databaseName: psychlab
    user: psychlab

services:
  - type: web
    name: psychlab
    runtime: docker
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: psychlab-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      # 同源部署时一般无需配置（后端已自动放行同源）；跨域部署才需要填写
      - key: CORS_ORIGIN
        value: ""
